name: CI

on:
  push:
    branches:
      - main
      - "bootstrap/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_CACHE_DIR: /tmp/uv-cache
      PIP_CACHE_DIR: /tmp/pip-cache
      HF_HOME: /tmp/huggingface
      TORCH_HOME: /tmp/torch
      XDG_CACHE_HOME: /tmp/xdg-cache
      TMPDIR: /tmp/mbs-tmp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Create cache and temporary directories
        run: mkdir -p "$UV_CACHE_DIR" "$PIP_CACHE_DIR" "$HF_HOME" "$TORCH_HOME" "$XDG_CACHE_HOME" "$TMPDIR"

      - name: Synchronize environment
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check --select E4,E7,E9,F .

      - name: Ruff formatting report
        continue-on-error: true
        run: uv run ruff format --check .

      - name: Pyright report
        continue-on-error: true
        run: uv run pyright

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Non-slow integration tests
        run: uv run pytest tests/integration -m "not slow"
