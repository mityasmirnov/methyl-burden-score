[project]
name = "methyl-burden-score"
version = "0.1.0.dev0"
description = "DeepRVAT-inspired hierarchical DNA methylation burden scoring"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Dmitrii Smirnov" }
]
keywords = [
  "dna-methylation",
  "epigenetics",
  "deep-sets",
  "pytorch",
  "multi-omics"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "duckdb>=1.1",
  "h5py>=3.11",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "rich>=13.7",
  "torch>=2.3",
  "typer>=0.12",
  "zarr>=2.18,<4"
]

[project.optional-dependencies]
training = [
  "lightning>=2.3",
  "scikit-learn>=1.5",
  "tensorboard>=2.17",
  "torchmetrics>=1.4",
  "tqdm>=4.66"
]
analysis = [
  "matplotlib>=3.9",
  "scipy>=1.13",
  "statsmodels>=0.14"
]
# Offline CpGPT export tooling (not an MBS training runtime dep).
# Install: uv sync --extra cpgpt
# CpGPT pins torch<=2.6; project override keeps the MBS torch line.
cpgpt = [
  "cpgpt",
]

[project.scripts]
mbs = "mbs.cli:app"

[dependency-groups]
dev = [
  "pre-commit>=3.7",
  "pyright>=1.1.370",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5"
]

[tool.uv]
# CpGPT declares torch<=2.6; Stage 0 MBS uses a newer torch. Override so the
# optional cpgpt extra can coexist without downgrading the project encoder stack.
override-dependencies = [
  "torch>=2.3",
]

# Host NVIDIA driver 570.x exposes CUDA 12.8. Pin Linux/Windows torch wheels to
# the cu128 index so cuda.is_available() works (PyPI's default Linux wheel is
# currently cu130 and refuses to init on this driver).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
cpgpt = { path = "vendor/cpgpt", editable = true }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbs"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/configs",
  "/schemas",
  "/sql",
  "/docs",
  "/README.md",
  "/AGENTS.md"
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
  "vendor",
  "data",
  "artifacts",
  "scratch",
  "cache",
  "docker",
  ".tools",
  ".venv",
]
[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "ANN",
  "C4",
  "DTZ",
  "ERA",
  "G",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "S",
  "T20",
  "TRY"
]
ignore = [
  "ANN401",
  "PLR0913",
  "TRY003",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "RUF002",
  "N812",
  "RUF007",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN201", "PLR2004", "S108", "E501"]
"src/mbs/**/*.py" = ["TRY003", "PLR0912", "RUF002"]
"src/mbs/annotation/cgi_context.py" = ["S608"]
"src/mbs/annotation/map_loci.py" = ["S608"]
"src/mbs/annotation/manifest.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: integration tests",
  "slow: tests that require large data or external models",
  "gpu: tests that require CUDA"
]

[tool.coverage.run]
source = ["mbs"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.pyright]
include = ["src", "tests"]
exclude = ["vendor", "data", "artifacts", "scratch", "cache"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
