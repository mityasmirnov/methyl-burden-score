# Cascade (native P2-G) + CpGPT2M static embeddings -- PLUMBING SMOKE.
# Purpose: prove the new cascade static-feature path trains and exports scores at
# real scale (65k prefix, fold 0, 6 epochs) before committing to a cascade OOF.
# This is NOT a benchmark and NOT gate evidence -- the epoch budget is far below
# the 30-epoch recipe, so its metrics are not comparable to anything.
# Derived from stage0_12_cascade_oof.yaml; the only substantive deltas are the
# CpGPT keys and the shortened budget.
split_id: hub-nine-pack-5fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
milestone: 12-cascade-oof
cv_budget:
  max_loci: 65536
  max_epochs: 6
experiment:
  name: stage0_12_cascade_cpgpt_smoke
  seed: 42
  stage: 0
pilot:
  mode: multitask_hub
  matrix_id: matrix-hub-nine-pack-virtual-v1
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
  tissue_ontology: canonical/phenotypes/tissue_ontology_hub_nine_pack_v1.yaml
  split_id: hub-nine-pack-5fold-v1
  static_feature_set: cpgpt2m_adapter_128_v1
model:
  topology: rbs_gene_direct
  tbs_arm: false
  cpg_pool: max
  region_pool: max
  gene_aggregation: scalar_rbs
  gene_allocation: explicit_only
  cpg_hidden_dim: 64
  region_hidden_dim: 32
  dropout: 0.1
training:
  max_epochs: 6
  batch_size: auto
  learning_rate: 0.001
  tissue_loss_weight: 3.0
  age_loss_weight: 0.3
  sex_loss_weight: 1.0
  gene_linked_only: true
  primary_evaluation: mbs_e2e
  stage_a_include_mbs_enet: false
  stage_a_defer_cpu_probes: true
  checkpoint_selection: validation_tissue_macro_f1_then_age_mae
  gradient_clip_norm: 2.0
  early_stopping_patience: 15
device:
  torch_device: cuda
features:
  static_feature_set: cpgpt2m_adapter_128_v1
stage0:
  use_cpgpt_static_features: true
