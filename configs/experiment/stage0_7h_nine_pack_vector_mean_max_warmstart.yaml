# 7H / Milestone 10: nine-pack vector RBS (region_hidden) — mean→max, warm-started
# from the converged scalar mean/max checkpoint (matched pooling; per-fold).
#
# Same rationale as stage0_7h_nine_pack_vector_max_max_warmstart.yaml: warm
# start the CpG/region/RBS encoder from an already-converged scalar_rbs
# checkpoint with the SAME cpg_pool/region_pool (mean/max) rather than
# training gene_rho jointly from scratch alongside a randomly-initialized
# encoder. From-scratch vector mean/max scored 0.335 F1 vs scalar mean/max's
# 0.330 F1 / 13.496 MAE / 0.875 AUROC (see vector_vs_scalar.md) -- this arm
# tests whether warm-starting improves on either.
split_id: hub-nine-pack-3fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
milestone: 7H-nine-pack-vector-mean-max-warmstart
report_dir: reports/inspection/stage0_7h_nine_pack_smoke/_staging_vector_mean_max_warmstart
cv_budget:
  max_loci: 65536
  max_epochs: 15
experiment:
  name: stage0_7h_nine_pack_vector_mean_max_warmstart
  seed: 42
  stage: 0
pilot:
  mode: multitask_hub
  matrix_id: matrix-hub-nine-pack-virtual-v1
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
  tissue_ontology: canonical/phenotypes/tissue_ontology_hub_nine_pack_v1.yaml
  split_id: hub-nine-pack-3fold-v1
model:
  topology: rbs_gene_direct
  tbs_arm: false
  cpg_pool: mean
  region_pool: max
  gene_aggregation: region_hidden
  gene_allocation: explicit_only
  cpg_hidden_dim: 64
  region_hidden_dim: 32
  dropout: 0.1
  warm_start_encoder_checkpoint: artifacts/runs/stage0-7h-nine-pack-scalar-mean-max/fold_{fold_id}/best.pt
  freeze_encoder_epochs: 4
  fine_tune_learning_rate: 0.0003
training:
  max_epochs: 15
  batch_size: auto
  learning_rate: 0.001
  tissue_loss_weight: 3.0
  age_loss_weight: 0.3
  sex_loss_weight: 1.0
  gene_linked_only: true
  primary_evaluation: mbs_e2e
  stage_a_include_mbs_enet: false
  checkpoint_selection: validation_tissue_macro_f1_then_age_mae
  gradient_clip_norm: 2.0
device:
  torch_device: cuda
