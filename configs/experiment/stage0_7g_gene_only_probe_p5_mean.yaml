# 7G′ Stage A: P5-G-mean (mean/mean, early stop; run if P4-G within ~0.03 F1 of P2-G).
split_id: hub-ats-7e-3fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_age_tissue_sex_full_v1.parquet
milestone: 7G-gene-only-P5-mean
report_dir: reports/inspection/stage0_7g_gene_only_probe/_staging_p5_mean_train
cv_budget:
  max_loci: 65536
  max_epochs: 30
experiment:
  name: stage0_7g_gene_only_probe_p5_mean
  seed: 42
  stage: 0
pilot:
  mode: multitask_hub
  matrix_id: matrix-hub-age-tissue-sex-full-v1
  graph_id: graph-grch38-gencode38-cgi-tile-v2
model:
  topology: rbs_gene_direct
  pooling: mean
  cpg_hidden_dim: 64
  region_hidden_dim: 32
  dropout: 0.1
training:
  max_epochs: 30
  early_stopping_patience: 5
  learning_rate: 0.001
  tissue_loss_weight: 3.0
  age_loss_weight: 0.3
  sex_loss_weight: 1.0
  gene_linked_only: true
  primary_evaluation: mbs_e2e
device:
  torch_device: cuda
