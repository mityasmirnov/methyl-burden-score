# P5 arm: P2 loss weights, 30-epoch ceiling, validation-tissue early stopping.
split_id: hub-ats-7e-3fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_age_tissue_sex_full_v1.parquet
milestone: 7G-tissue-probe-P5
report_dir: reports/inspection/stage0_7g_cascade_tissue_probe/_staging_p5_train
cv_budget:
  max_loci: 65536
  max_epochs: 30
experiment:
  name: stage0_7g_cascade_tissue_probe_p5
  seed: 42
  stage: 0
pilot:
  mode: multitask_hub
  matrix_id: matrix-hub-age-tissue-sex-full-v1
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_age_tissue_sex_full_v1.parquet
model:
  topology: rbs_gene_direct
  tbs_arm: false
  pooling: max
  neutral_score: 0.5
  cpg_hidden_dim: 64
  region_hidden_dim: 32
  dropout: 0.1
  activation: gelu
  layer_norm: true
training:
  max_epochs: 30
  learning_rate: 0.001
  batch_size: 1
  tissue_loss_weight: 3.0
  age_loss_weight: 0.3
  sex_loss_weight: 1.0
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001
device:
  torch_device: cuda
