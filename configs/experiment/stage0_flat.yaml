experiment:
  name: stage0_flat_cpgpt_max
  stage: 0
  seed: 42

stage0:
  use_cpgpt_static_features: true
  use_methylgpt_prior: false
  use_methylcapsnet_annotations: false
  use_epicv2_manifest: true
  use_longread: false
  use_attention_pooling: false

paths:
  # Resolved relative to MBS_DATA_ROOT / MBS_ARTIFACT_ROOT / MBS_SCRATCH_ROOT
  data_release: canonical/release=stage0-v1
  artifact_root: .
  scratch_root: .

features:
  methylation:
    beta: true
    m_value: true
    robust_deviation: false
    epsilon: 0.001
  static_feature_set: cpgpt2m_adapter_128_v1
  structured_annotations: true
  feature_source_dropout: 0.0

model:
  type: flat_deepset
  input_dimension: null
  phi_layers: 2
  phi_hidden_dimension: 20
  rho_layers: 3
  rho_hidden_dimension: 10
  activation: leaky_relu
  pooling: max
  output_activation: sigmoid
  neutral_score: 0.5
  dropout: 0.0

heads:
  age:
    enabled: true
    loss: mse
    target_standardization: train_fold
  tissue:
    enabled: true
    loss: cross_entropy
    class_weighting: train_fold_balanced

training:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_token_budget: 500000
  gradient_clip_norm: 2.0
  max_epochs: 100
  early_stopping_patience: 10
  precision: bf16-mixed
  num_workers: 8

crossfit:
  grouping_columns:
    - donor_id
    - replicate_group
    - study_id
  outer_folds: 3
  restarts_per_fold: 2
  final_outer_folds: 5
  final_restarts_per_fold: 6

logging:
  tensorboard: true
  wandb: false
  save_resolved_config: true
  save_environment: true
  save_checksums: true
