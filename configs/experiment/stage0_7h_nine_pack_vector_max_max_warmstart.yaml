# 7H / Milestone 10: nine-pack vector RBS (region_hidden) — max→max, warm-started
# from the converged P2-G scalar max/max checkpoint (per-fold, no cross-fold reuse).
#
# Motivation: the from-scratch vector max/max arm scored 0.333 tissue F1 vs
# P2-G scalar's 0.355 (see vector_vs_scalar.md) -- worse on every metric. But
# in that arm, gene_rho (region_hidden's only extra learned module vs scalar_rbs)
# was trained jointly from random init alongside the CpG/region encoder, which
# per LP-FT (Kumar et al. 2022) risks a randomly-initialized head's early noisy
# gradients distorting an otherwise-good encoder. This arm instead: (1) copies
# the CpG/region/RBS encoder from the already-converged P2-G checkpoint,
# (2) freezes it for the first 4 epochs while gene_rho + trait heads train
# alone (linear-probe phase), (3) unfreezes and fine-tunes everything jointly
# at a reduced LR for the remaining 11 epochs. Same total epoch budget (15) and
# split/seed as every other arm in the grid, so it's a fair A/B against both
# vector-from-scratch (0.333 F1) and P2-G scalar (0.355 F1, 13.431 MAE).
#
# {fold_id} is substituted per fold so each fold warm-starts only from its own
# matching P2-G fold checkpoint -- never a different fold (that would leak
# that fold's train split into this fold's test-time initialization).
split_id: hub-nine-pack-3fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
milestone: 7H-nine-pack-vector-max-max-warmstart
report_dir: reports/inspection/stage0_7h_nine_pack_smoke/_staging_vector_max_max_warmstart
cv_budget:
  max_loci: 65536
  max_epochs: 15
experiment:
  name: stage0_7h_nine_pack_vector_max_max_warmstart
  seed: 42
  stage: 0
pilot:
  mode: multitask_hub
  matrix_id: matrix-hub-nine-pack-virtual-v1
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
  tissue_ontology: canonical/phenotypes/tissue_ontology_hub_nine_pack_v1.yaml
  split_id: hub-nine-pack-3fold-v1
model:
  topology: rbs_gene_direct
  tbs_arm: false
  cpg_pool: max
  region_pool: max
  gene_aggregation: region_hidden
  gene_allocation: explicit_only
  cpg_hidden_dim: 64
  region_hidden_dim: 32
  dropout: 0.1
  warm_start_encoder_checkpoint: artifacts/runs/stage0-7h-nine-pack-P2-G/fold_{fold_id}/best.pt
  freeze_encoder_epochs: 4
  fine_tune_learning_rate: 0.0003
training:
  max_epochs: 15
  batch_size: auto
  learning_rate: 0.001
  tissue_loss_weight: 3.0
  age_loss_weight: 0.3
  sex_loss_weight: 1.0
  gene_linked_only: true
  primary_evaluation: mbs_e2e
  stage_a_include_mbs_enet: false
  checkpoint_selection: validation_tissue_macro_f1_then_age_mae
  gradient_clip_norm: 2.0
device:
  torch_device: cuda
