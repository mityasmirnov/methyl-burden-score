# Milestone 12 — N-light@64 OOF (first arm).
# SCOPE LOCK: HM450 nine-pack, first 65,536 matrix columns, then gene-linked
# explicit_only (~2.6k genes). This is a representation-validation 5×6, NOT
# the ~20k-gene product. Full-graph expansion: docs/plans/milestone-12b-full-gene-panel.md
# Split: hub-nine-pack-5fold-v1 (34 234, study-grouped). Protocol 5×6.
# Product readout: frozen nested elastic-net on gene MBS (not joint mbs_e2e).
# Encoder weights are gene-invariant; this cohort is still HM450 + 65k prefix.
# Platform transfer and held-out-gene tests are 12b, not this run.
#
# Encoder supervision: age/tissue/sex plus disease classes and cancer types
# with n>200 nine-pack *disease tissue* samples. Adjacent-normal stays unknown.
# Pack-matched `control` rows are observed negatives. Product readout is still
# nested enet on ATS (and later freeze-reuse probes), not these aux heads.
split_id: hub-nine-pack-5fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
cv_budget:
  # Ordered matrix prefix (not a genome-balanced gene panel). 12b lifts this.
  max_loci: 65536
  max_epochs: 30
experiment:
  name: stage0_12_nlight_oof
  seed: 42
  stage: 0
features:
  methylation:
    beta: true
    epsilon: 0.001
    m_value: true
    robust_deviation: false
  static_feature_set: none
heads:
  age:
    enabled: true
    huber_delta: 1.0
    linear: true
    loss: huber
    target_standardization: train_fold
  sex:
    enabled: true
    linear: true
    loss: cross_entropy
    n_classes: 2
  tissue:
    class_weighting: train_fold_balanced
    enabled: true
    linear: true
    loss: cross_entropy
    ontology: harmonized
  disease:
    enabled: true
    loss: bce_with_logits
    role: auxiliary
    linear: true
    value_column: phenotype_value
    min_count: 201
    count_within_sample_ids: true
    positive_sample_types: [disease tissue]
    negative_sample_types: [control]
    # Locked nine-pack disease-tissue n>200 (exact 200 excluded).
    label_names:
      - Alzheimer's disease
      - childhood asthma
      - multiple sclerosis
      - Parkinson's disease
      - psoriasis
      - rheumatoid arthritis
      - schizophrenia
      - stroke
      - systemic lupus erythematosus
  cancer:
    enabled: true
    loss: bce_with_logits
    role: auxiliary
    linear: true
    value_column: phenotype_value
    min_count: 201
    count_within_sample_ids: true
    positive_sample_types: [disease tissue]
    negative_sample_types: [control]
    # Locked nine-pack disease-tissue n>200 (exact 200 excluded).
    label_names:
      - acute myeloid leukemia
      - breast cancer
      - glioma
      - head and neck squamous-cell carcinoma
      - hepatocellular carcinoma
      - melanoma
      - prostate cancer
      - sarcoma
      - stomach cancer
loss:
  lambda_age: 0.3
  lambda_sex: 1.0
  lambda_tissue: 3.0
  lambda_disease: 1.0
  lambda_cancer: 1.0
model:
  topology: flat_region
  flat_region_feature_mode: m_only
  gene_allocation: explicit_only
  encoder:
    activation: gelu
    cpg_hidden_dim: 64
    dropout: 0.1
    layer_norm: true
  neutral_score: 0.5
  output_activation: sigmoid
  phi_hidden_dimension: 64
  phi_layers: 2
  pooling: mean
  rho_hidden_dimension: 64
  rho_layers: 2
  type: flat_deepset
pilot:
  auto_split: false
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  matrix_id: matrix-hub-nine-pack-virtual-v1
  disease_matrix_id: matrix-hub-disease-full-v1
  cancer_matrix_id: matrix-hub-cancer-full-v1
  mode: multitask_hub
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
  split_id: hub-nine-pack-5fold-v1
  static_feature_set: none
  tissue_ontology: canonical/phenotypes/tissue_ontology_hub_nine_pack_v1.yaml
stage0:
  use_cpgpt_static_features: false
training:
  # GPU2 ~98GB: request a large micro-batch; loop.py VRAM probe calibrates down.
  batch_size: 1024
  batch_token_budget: 128000000
  early_stopping_patience: 15
  gene_linked_only: true
  gene_allocation: explicit_only
  primary_evaluation: mbs_enet_nested
  stage_a_include_mbs_enet: false
  stage_a_defer_cpu_probes: true
  checkpoint_selection: validation_tissue_macro_f1_then_age_mae
  stage_a_per_epoch_eval: true
  gradient_clip_norm: 2.0
  learning_rate: 0.001
  max_epochs: 30
  optimizer: adamw
  precision: bf16-mixed
  require_cuda: true
  weight_decay: 0.0001
device:
  torch_device: cuda
