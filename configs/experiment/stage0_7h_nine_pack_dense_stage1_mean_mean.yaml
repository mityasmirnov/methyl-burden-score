# 7H / Milestone 10: dense-gradient stage-1 RBS pretrain (cpg_pool: mean,
# region_pool: mean, gene_aggregation: scalar_rbs).
#
# Motivation: even P2-G's own training never gave region_rho a *dense*
# gradient. scalar_rbs's MBS is max_pool(RBS-per-region-in-gene), and
# max-pooling routes gradient only to the single argmax region/CpG per
# step -- every other region/CpG gets exactly zero gradient that batch,
# for the whole 15-epoch budget. Using mean pooling at BOTH levels here
# (cpg_pool AND region_pool) instead gives every CpG and every region a
# nonzero gradient contribution every step, so the encoder gets a much
# more thorough training signal -- at the cost of mean-pooling being the
# wrong choice for the *final* burden-score semantics (a burden score
# wants "is there at least one impaired region," which mean dilutes;
# scalar_max_mean already scored worse than scalar_max_max, 0.318 vs
# 0.355, consistent with this).
#
# This checkpoint is NOT meant to be evaluated as a finalist candidate on
# its own -- it's a stage-1 pretrain. The follow-up step transplants this
# encoder into the max-pooled stage-2 configs (scalar and vector) via the
# same warm-start mechanism used for
# stage0_7h_nine_pack_vector_max_max_warmstart.yaml, to test whether a
# more thoroughly-trained encoder further closes (or reverses) the
# scalar-vs-vector gap, and whether it improves the RBS-linear-probe
# numbers that already beat mbs_e2e everywhere (see vector_vs_scalar.md
# "RBS-only classical probe vs. MBS-based prediction").
split_id: hub-nine-pack-3fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
milestone: 7H-nine-pack-dense-stage1-mean-mean
report_dir: reports/inspection/stage0_7h_nine_pack_smoke/_staging_dense_stage1_mean_mean
cv_budget:
  max_loci: 65536
  max_epochs: 15
experiment:
  name: stage0_7h_nine_pack_dense_stage1_mean_mean
  seed: 42
  stage: 0
pilot:
  mode: multitask_hub
  matrix_id: matrix-hub-nine-pack-virtual-v1
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
  tissue_ontology: canonical/phenotypes/tissue_ontology_hub_nine_pack_v1.yaml
  split_id: hub-nine-pack-3fold-v1
model:
  topology: rbs_gene_direct
  tbs_arm: false
  cpg_pool: mean
  region_pool: mean
  gene_aggregation: scalar_rbs
  gene_allocation: explicit_only
  cpg_hidden_dim: 64
  region_hidden_dim: 32
  dropout: 0.1
training:
  max_epochs: 15
  batch_size: auto
  learning_rate: 0.001
  tissue_loss_weight: 3.0
  age_loss_weight: 0.3
  sex_loss_weight: 1.0
  gene_linked_only: true
  primary_evaluation: mbs_e2e
  stage_a_include_mbs_enet: false
  checkpoint_selection: validation_tissue_macro_f1_then_age_mae
  gradient_clip_norm: 2.0
device:
  torch_device: cuda
