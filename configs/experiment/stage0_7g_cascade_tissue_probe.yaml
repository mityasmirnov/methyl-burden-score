# Milestone 7G cascade tissue-head probe (P0–P5 + narrow refusion grid).
split_id: hub-ats-7e-3fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_age_tissue_sex_full_v1.parquet
milestone: 7G-tissue-probe
report_dir: reports/inspection/stage0_7g_cascade_tissue_probe
baseline_run_id: stage0-7g-cascade-v1
cv_budget:
  max_loci: 65536
  max_epochs: 15
experiment:
  name: stage0_7g_cascade_tissue_probe
  seed: 42
  stage: 0
pilot:
  mode: multitask_hub
  matrix_id: matrix-hub-age-tissue-sex-full-v1
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_age_tissue_sex_full_v1.parquet
model:
  topology: rbs_gene_direct
  tbs_arm: false
  pooling: max
  neutral_score: 0.5
  cpg_hidden_dim: 64
  region_hidden_dim: 32
  dropout: 0.1
  activation: gelu
  layer_norm: true
training:
  max_epochs: 15
  learning_rate: 0.001
  batch_size: 1
device:
  torch_device: cuda
arms:
  - id: P0-baseline
    kind: cascade_replay
    run_id: stage0-7g-cascade-v1
  - id: P1-fusion-tissue-heavy
    kind: fusion_only
    source_run_id: stage0-7g-cascade-v1
    fusion:
      tissue_solver: balanced_logistic
      pca_components: 32
  - id: P2-end2end-tissue-weight
    kind: cascade_train
    run_id: stage0-7g-tissue-probe-P2
    config: configs/experiment/stage0_7g_cascade_tissue_probe_p2.yaml
  - id: P3-region-head-bypass
    kind: transparent_region
    arm: T-mean-region
  - id: P2-fusion-balanced
    kind: fusion_only
    source_run_id: stage0-7g-tissue-probe-P2
    fusion:
      tissue_solver: balanced_logistic
  - id: P4-pooling-mean
    kind: cascade_train
    run_id: stage0-7g-tissue-probe-P4-mean
    config: configs/experiment/stage0_7g_cascade_tissue_probe_p4.yaml
  - id: P4-fusion-balanced
    kind: fusion_only
    source_run_id: stage0-7g-tissue-probe-P4-mean
    fusion:
      tissue_solver: balanced_logistic
  - id: P5-epochs-30
    kind: cascade_train
    run_id: stage0-7g-tissue-probe-P5-epochs30
    config: configs/experiment/stage0_7g_cascade_tissue_probe_p5.yaml
  - id: P5-fusion-balanced
    kind: fusion_only
    source_run_id: stage0-7g-tissue-probe-P5-epochs30
    fusion:
      tissue_solver: balanced_logistic
