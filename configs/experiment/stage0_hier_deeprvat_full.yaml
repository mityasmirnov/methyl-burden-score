# Stage 0 hierarchical DeepRVAT-style baseline on full Hub packs (Milestone 6).
# Shared HierarchicalDeepSet MBS + parallel linear phenotype modules + masked loss.
# Reuses 5d cohort / preferred flat split.json for fair comparison.
# Historical sketch only: configs/experiment/stage0_hier_max.yaml

experiment:
  name: stage0_hier_deeprvat_full
  stage: 0
  public_model_name: deepMAT-hierarchical
  seed: 42

stage0:
  use_cpgpt_static_features: true
  use_methylgpt_prior: false
  use_methylcapsnet_annotations: false
  use_epicv2_manifest: true
  use_longread: false
  use_attention_pooling: false

pilot:
  mode: deeprvat_hub
  matrix_id: matrix-hub-age-tissue-sex-full-v1
  graph_id: graph-grch38-gencode38-five-role-v1
  static_feature_set: cpgpt2m_adapter_128_v1
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_age_tissue_sex_full_v1.parquet
  tissue_ontology: canonical/phenotypes/tissue_ontology_age_tissue_sex_full_v1.yaml
  auto_split: true
  reuse_flat_split: true
  flat_split_run_id: stage0-flat-deeprvat-age-tissue-sex-full-v1
  split_id: hub-age-tissue-sex-full-auto-v1

data:
  phenotype_registry: configs/data/phenotype_registry.yaml
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_age_tissue_sex_full_v1.parquet
  tissue_ontology: canonical/phenotypes/tissue_ontology_age_tissue_sex_full_v1.yaml
  wave: 1

features:
  methylation:
    beta: true
    m_value: true
    epsilon: 0.001
  static_feature_set: cpgpt2m_adapter_128_v1

model:
  type: hierarchical_deepset
  region_types:
    - promoter_core
    - promoter_proximal
    - five_prime
    - three_prime
    - gene_body
  residual_path: true
  cpg_hidden_dimension: 64
  region_hidden_dimension: 32
  region_type_dimension: 8
  cpg_pooling: max
  region_pooling: max
  residual_pooling: max
  output_activation: sigmoid
  neutral_score: 0.5
  dropout: 0.1
  normalization: layer_norm

heads:
  age:
    enabled: true
    loss: huber
    huber_delta: 1.0
    target_standardization: train_fold
    linear: true
  tissue:
    enabled: true
    loss: cross_entropy
    class_weighting: train_fold_balanced
    ontology: harmonized
    linear: true
  sex:
    enabled: true
    loss: cross_entropy
    n_classes: 2
    linear: true
  disease:
    enabled: false
  cancer:
    enabled: false
  blood:
    enabled: false
  brain:
    enabled: false

loss:
  lambda_age: 1.0
  lambda_tissue: 1.0
  lambda_sex: 1.0
  lambda_disease: 0.0
  lambda_cancer: 0.0
  lambda_blood: 0.0
  lambda_brain: 0.0

training:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 4
  batch_token_budget: 500000
  gradient_clip_norm: 2.0
  max_epochs: 40
  early_stopping_patience: 8
  precision: bf16-mixed
  num_workers: 0
  require_cuda: true

splits:
  grouping_columns:
    - study_id
    - donor_id
  protocol: study_grouped
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15

device:
  cuda_visible_devices: "0"
  torch_device: cuda

logging:
  tensorboard: true
  auto_tensorboard: true
  tensorboard_port: 6008
  jsonl: true
  wandb: false
  save_resolved_config: true
  save_environment: true
  save_checksums: true

evaluation:
  age_metrics: [mae, rmse, pearson, spearman]
  tissue_metrics: [macro_f1, balanced_accuracy, confusion_matrix]
  sex_metrics: [accuracy, balanced_accuracy]
  report_by: [study_id, platform_id, phenotype_family]
  ablation_max_samples: 512
  ablations:
    - full
    - mapped_only
    - residual_only
    - promoters_only
    - gene_body_only
  compare_flat_run_id: stage0-flat-deeprvat-age-tissue-sex-full-v1