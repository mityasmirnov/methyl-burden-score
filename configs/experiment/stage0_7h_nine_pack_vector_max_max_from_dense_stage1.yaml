# 7H / Milestone 10: vector (region_hidden) max/max, warm-started from the
# dense-gradient (mean/mean) stage-1 pretrain rather than from the P2-G
# (natively max/max-trained) checkpoint used in
# stage0_7h_nine_pack_vector_max_max_warmstart.yaml.
#
# Compares against that arm (0.342 F1 / 13.406 MAE / 0.851 AUROC) to test
# whether the denser stage-1 gradient signal helps vector even more than
# warm-starting from a max/max-native encoder -- vector's gene_rho pools
# the raw region_hidden vector (not the collapsed RBS scalar), so it should
# be the more sensitive receiver of a better-trained region-level encoder.
# Same LP-FT recipe: freeze 4 epochs, fine-tune 11 at reduced LR.
split_id: hub-nine-pack-3fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
milestone: 7H-nine-pack-vector-max-max-from-dense-stage1
report_dir: reports/inspection/stage0_7h_nine_pack_smoke/_staging_vector_max_max_from_dense_stage1
cv_budget:
  max_loci: 65536
  max_epochs: 15
experiment:
  name: stage0_7h_nine_pack_vector_max_max_from_dense_stage1
  seed: 42
  stage: 0
pilot:
  mode: multitask_hub
  matrix_id: matrix-hub-nine-pack-virtual-v1
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
  tissue_ontology: canonical/phenotypes/tissue_ontology_hub_nine_pack_v1.yaml
  split_id: hub-nine-pack-3fold-v1
model:
  topology: rbs_gene_direct
  tbs_arm: false
  cpg_pool: max
  region_pool: max
  gene_aggregation: region_hidden
  gene_allocation: explicit_only
  cpg_hidden_dim: 64
  region_hidden_dim: 32
  dropout: 0.1
  warm_start_encoder_checkpoint: artifacts/runs/stage0-7h-nine-pack-dense-stage1-mean-mean/fold_{fold_id}/best.pt
  freeze_encoder_epochs: 4
  fine_tune_learning_rate: 0.0003
training:
  max_epochs: 15
  batch_size: auto
  learning_rate: 0.001
  tissue_loss_weight: 3.0
  age_loss_weight: 0.3
  sex_loss_weight: 1.0
  gene_linked_only: true
  primary_evaluation: mbs_e2e
  stage_a_include_mbs_enet: false
  checkpoint_selection: validation_tissue_macro_f1_then_age_mae
  gradient_clip_norm: 2.0
device:
  torch_device: cuda
