# Milestone 10c — freeze-and-reuse BMI head (STUB — do not auto-queue on GPU 0).
#
# DeepRVAT-style: warm-start the shared encoder from the nine-pack P2-G
# finalist, freeze it for the full epoch budget, train only ``bmi_head``.
# Requires phenotype table with real ``bmi`` / ``bmi_mask`` (label-prep done).
# Launch only after M10 GPU track frees and ops explicitly enable this arm.
#
# Status: wired in MultitaskHeads + masked loss; cascade loop still age/tissue/sex
# primary — enable via future ``training.bmi_loss_weight`` / head-only runner.
split_id: hub-nine-pack-3fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
milestone: 10c-freeze-reuse-bmi-stub
report_dir: reports/inspection/stage0_7h_nine_pack_smoke/_staging_bmi_freeze_reuse
cv_budget:
  max_loci: 65536
  max_epochs: 8
experiment:
  name: stage0_10c_bmi_freeze_reuse_stub
  seed: 42
  stage: 0
pilot:
  mode: multitask_hub
  matrix_id: matrix-hub-nine-pack-virtual-v1
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
  tissue_ontology: canonical/phenotypes/tissue_ontology_hub_nine_pack_v1.yaml
  split_id: hub-nine-pack-3fold-v1
model:
  topology: rbs_gene_direct
  tbs_arm: false
  cpg_pool: max
  region_pool: max
  gene_aggregation: scalar_rbs
  gene_allocation: explicit_only
  cpg_hidden_dim: 64
  region_hidden_dim: 32
  dropout: 0.1
  # Freeze-and-reuse: encoder from P2-G; freeze for all epochs (head-only).
  warm_start_encoder_checkpoint: artifacts/runs/stage0-7h-nine-pack-P2-G/fold_{fold_id}/best.pt
  freeze_encoder_epochs: 8
  bmi_enabled: true
  n_ancestry_classes: 0
training:
  max_epochs: 8
  batch_size: auto
  learning_rate: 0.001
  tissue_loss_weight: 0.0
  age_loss_weight: 0.0
  sex_loss_weight: 0.0
  bmi_loss_weight: 1.0
  ancestry_loss_weight: 0.0
  gene_linked_only: true
  primary_evaluation: mbs_e2e
  stage_a_include_mbs_enet: false
  checkpoint_selection: validation_bmi_mae
  gradient_clip_norm: 2.0
  # GPU gated — do not add to run_7h_* queues without explicit approval.
  auto_queue: false
device:
  torch_device: cuda
