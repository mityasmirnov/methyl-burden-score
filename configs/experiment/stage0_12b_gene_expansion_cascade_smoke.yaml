# Milestone 12b probe: does lifting the 65,536-column ordered prefix (only
# ~2.6k of 19,937 graph genes) to the full gene-linked column universe change
# P2-G cascade representation quality at all? Same Milestone-10 finalist
# settings as stage0_7h_nine_pack_p2_g.yaml (hub-nine-pack-3fold-v1, fold 0
# only, scalar max/max pooling) with cv_budget.max_loci removed (null = no
# prefix cap) and max_epochs bumped 15->16 for parity with the N-light
# smoke. Cheap go/no-go smoke, not the full 12b recipe (no within-gene CpG
# sampling cap, no role embeddings) -- see
# docs/plans/milestone-12b-full-gene-panel.md for that.
split_id: hub-nine-pack-3fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
milestone: 12b-gene-expansion-smoke
report_dir: reports/inspection/stage0_12b_gene_expansion_smoke/_staging_cascade
cv_budget:
  max_loci: null
  max_epochs: 16
experiment:
  name: stage0_12b_gene_expansion_cascade_smoke
  seed: 42
  stage: 0
pilot:
  mode: multitask_hub
  matrix_id: matrix-hub-nine-pack-virtual-v1
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
  tissue_ontology: canonical/phenotypes/tissue_ontology_hub_nine_pack_v1.yaml
  split_id: hub-nine-pack-3fold-v1
model:
  topology: rbs_gene_direct
  tbs_arm: false
  cpg_pool: max
  region_pool: max
  gene_aggregation: scalar_rbs
  gene_allocation: explicit_only
  cpg_hidden_dim: 64
  region_hidden_dim: 32
  dropout: 0.1
training:
  max_epochs: 16
  batch_size: auto
  learning_rate: 0.001
  tissue_loss_weight: 3.0
  age_loss_weight: 0.3
  sex_loss_weight: 1.0
  gene_linked_only: true
  primary_evaluation: mbs_e2e
  stage_a_include_mbs_enet: false
  checkpoint_selection: validation_tissue_macro_f1_then_age_mae
  gradient_clip_norm: 2.0
device:
  torch_device: cuda
