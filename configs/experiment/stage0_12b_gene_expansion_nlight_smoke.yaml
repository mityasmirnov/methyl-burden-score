# Milestone 12b probe: does lifting the 65,536-column ordered prefix (only
# ~2.6k of 19,937 graph genes) to the full gene-linked column universe change
# N-light representation quality at all? Same Milestone-10 settings as
# stage0_7h_nine_pack_m_only_wide.yaml (16 epochs, hub-nine-pack-3fold-v1,
# fold 0 only) with cv_budget.max_loci removed (null = no prefix cap) and
# batch_size switched to auto (loop.py VRAM probe calibrates down for the
# larger per-sample edge count). This is a cheap go/no-go smoke, not the
# full 12b recipe (no within-gene CpG sampling cap, no role embeddings) --
# see docs/plans/milestone-12b-full-gene-panel.md for that.
split_id: hub-nine-pack-3fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
cv_budget:
  max_loci: null
  max_epochs: 16
experiment:
  name: stage0_12b_gene_expansion_nlight_smoke
  seed: 42
  stage: 0
features:
  methylation:
    beta: true
    epsilon: 0.001
    m_value: true
    robust_deviation: false
  static_feature_set: none
heads:
  age:
    enabled: true
    huber_delta: 1.0
    linear: true
    loss: huber
    target_standardization: train_fold
  sex:
    enabled: true
    linear: true
    loss: cross_entropy
    n_classes: 2
  tissue:
    class_weighting: train_fold_balanced
    enabled: true
    linear: true
    loss: cross_entropy
    ontology: harmonized
loss:
  lambda_age: 0.3
  lambda_sex: 1.0
  lambda_tissue: 3.0
model:
  topology: flat_region
  flat_region_feature_mode: m_only
  gene_allocation: explicit_only
  encoder:
    activation: gelu
    cpg_hidden_dim: 64
    dropout: 0.1
    layer_norm: true
  neutral_score: 0.5
  output_activation: sigmoid
  phi_hidden_dimension: 64
  phi_layers: 2
  pooling: mean
  rho_hidden_dimension: 64
  rho_layers: 2
  type: flat_deepset
pilot:
  auto_split: false
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  matrix_id: matrix-hub-nine-pack-virtual-v1
  mode: multitask_hub
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_hub_nine_pack_v1.parquet
  split_id: hub-nine-pack-3fold-v1
  static_feature_set: none
  tissue_ontology: canonical/phenotypes/tissue_ontology_hub_nine_pack_v1.yaml
stage0:
  use_cpgpt_static_features: false
training:
  batch_size: auto
  batch_token_budget: 32000000
  early_stopping_patience: 5
  gene_linked_only: true
  gene_allocation: explicit_only
  primary_evaluation: mbs_e2e
  stage_a_include_mbs_enet: false
  stage_a_defer_cpu_probes: true
  checkpoint_selection: validation_tissue_macro_f1_then_age_mae
  stage_a_per_epoch_eval: true
  gradient_clip_norm: 2.0
  learning_rate: 0.001
  max_epochs: 16
  optimizer: adamw
  precision: bf16-mixed
  require_cuda: true
  weight_decay: 0.0001
device:
  torch_device: cuda
