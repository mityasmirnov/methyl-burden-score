    pool: mean
  - id: N-light-gene-ablation-n1-anno-only-s2
    kind: flat_region_train
    run_prefix: stage0-7g-gene-probe-ablation-n1-anno-only-s2
    config: configs/experiment/stage0_7g_gene_only_probe_ablation_n1_anno_only_s2.yaml
    pool: mean
  - id: N-light-gene-ablation-n2-reg-permuted
    kind: flat_region_train
    run_prefix: stage0-7g-gene-probe-ablation-n2-reg-permuted
    config: configs/experiment/stage0_7g_gene_only_probe_ablation_n2_reg_permuted.yaml
    pool: mean
  - id: N-light-gene-ablation-n2-reg-permuted-s2
