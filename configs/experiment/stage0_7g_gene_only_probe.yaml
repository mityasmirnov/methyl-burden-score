    config: configs/experiment/stage0_7g_gene_only_probe_ablation_full_s2.yaml
    pool: mean
  - id: N-light-gene-ablation-n0-obs-only
    kind: flat_region_train
    run_prefix: stage0-7g-gene-probe-ablation-n0-obs-only
