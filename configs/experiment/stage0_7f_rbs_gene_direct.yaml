# Milestone 7F: RBS→gene cascade + leftover direct (no TBS).
# Reuses frozen hub-ats-7e-3fold-v1; 7E-comparable budget (full budget → 7G).
split_id: hub-ats-7e-3fold-v1
sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_age_tissue_sex_full_v1.parquet
cv_budget:
  max_loci: 8192
  max_epochs: 2
experiment:
  name: stage0_7f_rbs_gene_direct
  seed: 42
  stage: 0
pilot:
  mode: multitask_hub
  matrix_id: matrix-hub-age-tissue-sex-full-v1
  graph_id: graph-grch38-gencode38-cgi-tile-v2
  sample_phenotype_table: canonical/phenotypes/sample_phenotype_table_age_tissue_sex_full_v1.parquet
model:
  topology: rbs_gene_direct
  tbs_arm: false
  pooling: max
  neutral_score: 0.5
training:
  max_epochs: 2
  learning_rate: 0.001
  batch_size: 1
device:
  torch_device: cpu
