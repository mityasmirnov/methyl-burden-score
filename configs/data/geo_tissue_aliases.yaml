# GEO raw tissue strings → Hub coarse ontology labels.
# Keys are matched case-insensitively after strip; values must exist in the
# tissue ontology used at fetch/merge (default: tissue_ontology_hub_nine_pack_v1).
# Unlisted strings fall through to casefold exact match on ontology labels.

version: geo-tissue-aliases-v1
aliases:
  blood: whole blood
  whole blood: whole blood
  peripheral blood: whole blood
  whole peripheral blood: whole blood
  venous blood: whole blood
  wb: whole blood
  pb: whole blood
  pbmc: peripheral blood mononuclear cell
  pbmcs: peripheral blood mononuclear cell
  peripheral blood mononuclear cell: peripheral blood mononuclear cell
  peripheral blood mononuclear cells: peripheral blood mononuclear cell
  peripheral blood leukocytes: leukocyte
  peripheral blood leucocytes: leukocyte
  blood leukocytes: leukocyte
  blood leucocytes: leukocyte
  leukocytes: leukocyte
  leucocytes: leukocyte
  mononuclear cell: peripheral blood mononuclear cell
  mononuclear cells: peripheral blood mononuclear cell
  # PBL (peripheral blood lymphocytes) excludes granulocytes, same as PBMC --
  # closer to "peripheral blood mononuclear cell" than to the broader
  # "leukocyte" (which includes granulocytes). Approximate, not exact.
  pbl: peripheral blood mononuclear cell
  peripheral blood lymphocytes: peripheral blood mononuclear cell
  peripheral blood lymphocyte: peripheral blood mononuclear cell
  # "White blood cell" is an exact synonym for leukocyte (all granulocyte +
  # mononuclear populations), unlike PBL/PBMC above.
  white blood cell: leukocyte
  white blood cells: leukocyte
  wbc: leukocyte
  peripheral blood sample: whole blood
  blood dna: whole blood
  baby_venous_blood: whole blood
  mother_venous_blood: whole blood
  cord blood: cord blood
  umbilical cord blood: cord blood
  umbilical cord blood buffy coat: cord blood
  cord blood buffy coat: cord blood
  buffy coat: leukocyte
  blood - buffy coat: leukocyte
  blood samples: whole blood
  blood sample: whole blood
  genomic dna from whole blood: whole blood
  peripheral white blood cells: leukocyte
  peripheral whole blood: whole blood
  blood - edta tube: whole blood
  dlpfc: brain - dorsolateral prefrontal cortex
  frozen normal breast tissue: breast
  frozen adjacent normal breast tissue: breast
  cerebellum: brain - cerebellum
  frontal cortex: brain - frontal cortex
  frontal lobe: brain - frontal lobe
  occipital lobe: brain - occipital lobe
  entorhinal cortex: brain - entorhinal cortex
  dorsolateral prefrontal cortex: brain - dorsolateral prefrontal cortex
  superior temporal gyrus: brain - superior temporal gyrus
  buccal: buccal epithelium
  buccal swab: buccal epithelium
  buccal cells: buccal epithelium
  adipose tissue: adipose
  fat: adipose
  skeletal muscle tissue: skeletal muscle
  sperm: semen
  sperm sample: semen
  lysed sperm sample: semen
  somatic cell lysed sperm sample: semen
  # Wave-1 recoveries (source_name fallback + common unmapped strings).
  cd14+ cell: CD14+ monocyte
  cd14+ cells: CD14+ monocyte
  cd14+ monocyte: CD14+ monocyte
  cd14+ monocytes: CD14+ monocyte
  # Tumor tissue is methylation-distinct from its tissue of origin (CpG
  # island methylator phenotype, systematic hyper/hypomethylation) -- map to
  # a separate "{organ} - tumor" class, never to the plain organ label, so
  # it can't get silently averaged into what should be normal-tissue ground
  # truth. Still records the anatomical origin, just as an independent class.
  brain tumor: brain - tumor
  brain tumours: brain - tumor
  cns tumor tissue: brain - tumor
  cns tumour tissue: brain - tumor
  meningioma: brain - tumor
  medulloblastoma: brain - tumor
  glioblastoma: brain - tumor
  malignant glioma: brain - tumor
  ependymal tumor: brain - tumor
  ependymal tumour: brain - tumor
  cns-pnet: brain - tumor
  primary brain tumor tissue: brain - tumor
  primary atrt tumor tissue: brain - tumor
  breast tumor: breast - tumor
  breast tumours: breast - tumor
  frozen tumor breast tissue: breast - tumor
  # Cell lines are immortalized/heavily-passaged cultures with their own
  # well-documented methylation drift, independent of tumor-vs-normal status
  # -- a third, distinct class from both normal tissue and primary tumor.
  breast cancer cell line: breast - cell line
  colorectal cancer cell line: colon - cell line
