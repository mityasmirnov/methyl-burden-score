    source_system: ewas_datahub
    phenotype_family: cell_type
    study_id: GSE35069
    platform: HM450
    sample_count: 60
    label_type: multiclass
    split_role: pilot
    download_path: raw/ewas_datahub/EWAS_db/GSE35069
    checksum: null
    notes: Smoke pilot; labels from CpGCorpus metadata.arrow join.

