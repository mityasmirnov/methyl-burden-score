# Stage 0 phenotype / source dataset registry (Milestone 5b).
# Checksums for large binaries live under
# $MBS_DATA_ROOT/canonical/registries/download_checksums.parquet after download.
registry_version: phenotype-registry-v1
description: >
  EWAS Data Hub phenotype packs and the GSE35069 pilot. Wave-1 families:
  age, tissue, disease. Wave-2 / secondary: cancer, blood, brain, sex,
  ancestry, BMI. Atlas is validation-only and is not listed as training data.

entries:
