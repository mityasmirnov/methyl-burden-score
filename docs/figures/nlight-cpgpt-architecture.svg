<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">N-light@64 + CpGPT architecture</title>
  <desc id="desc">Shared gene-invariant encoder: M-value plus 128-d DNA-sequence embedding, mean-pool by gene, gene network, MBS, frozen nested elastic-net.</desc>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="40" y="42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">N-light@64 + CpGPT - light product path</text>
  <text x="40" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">FlatDeepSetRegion | gene-linked CpGs | HM450 nine-pack | product readout = frozen nested elastic-net</text>

  <rect x="40" y="100" width="150" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">M-value</text>
  <text x="115" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e40af">observed CpG</text>

  <rect x="40" y="190" width="150" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">CpGPT 128-d</text>
  <text x="115" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#166534">DNA seq | 2001 bp</text>

  <path d="M190 136 H220" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M190 226 H220" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="130" width="140" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="290" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Shared phi</text>
  <text x="290" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a16207">CpG MLP</text>
  <text x="290" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a16207">no gene / study ID</text>

  <path d="M360 180 H400" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="400" y="140" width="130" height="80" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="465" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Mean-pool</text>
  <text x="465" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6d28d9">by gene</text>

  <path d="M530 180 H570" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="570" y="140" width="130" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="635" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Gene rho</text>
  <text x="635" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a16207">hidden 64</text>

  <path d="M700 180 H740" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="740" y="140" width="180" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="830" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">MBS in [0,1]</text>
  <text x="830" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#047857">+ presence mask</text>

  <rect x="220" y="280" width="700" height="100" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="240" y="310" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Product readout (freeze encoder)</text>
  <text x="240" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">Frozen nested elastic-net on sample x gene MBS -&gt; age / tissue / sex</text>
  <text x="240" y="358" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">Joint mbs_e2e heads = architecture screen only (noisier; worse age)</text>

  <rect x="40" y="410" width="880" height="100" rx="8" fill="#111827"/>
  <text x="60" y="442" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f9fafb">Locked metrics (nine-pack HM450)</text>
  <text x="60" y="468" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db">5x6 OOF nested (65k prefix, 2 646 genes): tissue F1 0.316 | age MAE 9.59 | sex AUROC 0.822</text>
  <text x="60" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db">+ CpGPT fold-0 x6: age MAE 8.10 +/- 0.14 (vs 9.57 baseline) | sex +0.065 | tissue -0.021</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
